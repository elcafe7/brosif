[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brosif"
version = "0.2.0"
description = "Offline multilingual terminal lexicon"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["rich>=13"]

[project.scripts]
db-explorer = "db_explorer.cli:main"
brosif = "brosif.cli:main"

[tool.setuptools.packages.find]
include = ["db_explorer*", "brosif*"]

[tool.setuptools.package-data]
brosif = ["sources.json"]
