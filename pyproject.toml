[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "db-explorer-template"
version = "0.1.0"
description = "Reusable reactive terminal explorer for SQLite databases"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["rich>=13"]

[project.scripts]
db-explorer = "db_explorer.cli:main"

[tool.setuptools.packages.find]
include = ["db_explorer*"]

