[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brosif"
version = "0.2.1"
description = "Offline multilingual terminal lexicon"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
dependencies = ["rich>=13", "beta-code>=1.1.1"]

[project.scripts]
db-explorer = "db_explorer.cli:main"
brosif = "brosif.cli:main"

[tool.setuptools.packages.find]
include = ["db_explorer*", "brosif*"]

[tool.setuptools.package-data]
brosif = ["sources.json"]
