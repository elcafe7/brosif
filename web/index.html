<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brosif</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e0e0e0;
    --muted: #6b7280;
    --accent: #60a5fa;
    --green: #34d399;
    --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 24px 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
  }
  #status {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
  }
  #status.ok { background: var(--green); }
  #search-box {
    padding: 12px 24px;
  }
  #query {
    width: 100%;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  #query:focus { border-color: var(--accent); }
  #query::placeholder { color: var(--muted); }
  #results {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px 24px;
  }
  .result {
    padding: 12px 14px;
    margin-bottom: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .result:hover { border-color: var(--accent); }
  .result-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .result-headword {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
  }
  .result-meta {
    font-size: 12px;
    color: var(--muted);
  }
  .result-def {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 60px;
    z-index: 10;
  }
  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 680px;
    max-width: 90vw;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }
  .detail-panel h2 {
    font-size: 20px;
    margin-bottom: 4px;
  }
  .detail-panel .lang {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .sense {
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }
  .sense:first-of-type { border-top: none; }
  .sense-head {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .sense-def {
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 4px;
  }
  .sense-extra {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
    margin-top: 4px;
    white-space: pre-wrap;
  }
  .sense-source {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    font-size: 14px;
  }
  .hint {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>brosif</h1>
  <div id="status" title="disconnected"></div>
</header>

<div id="search-box">
  <input id="query" type="text" placeholder="search..." autofocus>
</div>

<div id="results">
  <div class="hint">type to search</div>
</div>

<div id="detail-overlay" class="detail-overlay" style="display:none" onclick="closeDetail(event)">
  <div class="detail-panel" id="detail-panel"></div>
</div>

<script>
const API = window.location.origin;
const statusEl = document.getElementById('status');
const queryEl = document.getElementById('query');
const resultsEl = document.getElementById('results');
const detailOverlay = document.getElementById('detail-overlay');
const detailPanel = document.getElementById('detail-panel');

let debounceTimer = null;
let lastQuery = '';

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const ok = r.ok;
    statusEl.className = ok ? 'ok' : '';
    statusEl.title = ok ? 'connected' : 'error';
  } catch {
    statusEl.className = '';
    statusEl.title = 'disconnected';
  }
}

checkHealth();
setInterval(checkHealth, 5000);

queryEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(doSearch, 180);
});

queryEl.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    queryEl.value = '';
    resultsEl.innerHTML = '<div class="hint">type to search</div>';
  }
});

async function doSearch() {
  const q = queryEl.value.trim();
  if (!q) {
    resultsEl.innerHTML = '<div class="hint">type to search</div>';
    return;
  }
  if (q === lastQuery) return;
  lastQuery = q;
  try {
    const r = await fetch(`${API}/query?q=${encodeURIComponent(q)}&limit=60`);
    const data = await r.json();
    if (data.error) {
      resultsEl.innerHTML = `<div class="empty">${esc(data.error)}</div>`;
      return;
    }
    renderResults(data.results);
  } catch {
    resultsEl.innerHTML = '<div class="empty">could not reach server</div>';
  }
}

function renderResults(rows) {
  if (!rows.length) {
    resultsEl.innerHTML = '<div class="empty">no results</div>';
    return;
  }
  resultsEl.innerHTML = rows.map((r, i) => `
    <div class="result" onclick='openDetail(${JSON.stringify(r.id)})'>
      <div class="result-header">
        <span class="result-headword">${esc(r.headword)}</span>
        <span class="result-meta">${esc(r.part_of_speech || '')} &middot; ${esc(r.language)} &middot; ${esc(r.source_name)}</span>
      </div>
      <div class="result-def">${esc(r.definition)}</div>
    </div>
  `).join('');
}

async function openDetail(id) {
  try {
    const r = await fetch(`${API}/detail?id=${id}`);
    const data = await r.json();
    if (data.error) return;
    const e = data.entry;
    detailPanel.innerHTML = `
      <h2>${esc(e.headword)}</h2>
      <div class="lang">${esc(e.language)} &middot; ${esc(e.part_of_speech || '')} &middot; ${esc(e.source_name)}</div>
      <div class="sense">
        <div class="sense-def">${esc(e.definition)}</div>
        ${e.synonyms ? `<div class="sense-extra">Synonyms: ${esc(e.synonyms)}</div>` : ''}
        ${e.pronunciation ? `<div class="sense-extra">Pronunciation: ${esc(e.pronunciation)}</div>` : ''}
        ${e.examples ? `<div class="sense-extra">Examples:\n${esc(e.examples)}</div>` : ''}
        ${e.forms ? `<div class="sense-extra">Forms: ${esc(e.forms)}</div>` : ''}
        ${e.etymology ? `<div class="sense-extra">Etymology: ${esc(e.etymology)}</div>` : ''}
      </div>
      <div class="sense-source">${esc(e.source_name)} ${esc(e.version || '')} &middot; ${esc(e.license)}</div>
      <div class="sense-source">${esc(e.attribution)}</div>
      <div class="sense-source">${esc(e.homepage)}</div>
    `;
    detailOverlay.style.display = 'flex';
  } catch {}
}

function closeDetail(e) {
  if (e.target === detailOverlay) detailOverlay.style.display = 'none';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') detailOverlay.style.display = 'none';
});

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
</script>

</body>
</html>
